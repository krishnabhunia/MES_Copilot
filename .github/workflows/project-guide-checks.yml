name: Project guide and source checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate docs and diagrams
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('docs/PROJECT_GUIDE.md').read_text()
          assert s.count('~~~') % 2 == 0 and s.count('~~~mermaid') >= 3
          assert 'docs/PROJECT_GUIDE.md' in Path('README.md').read_text(encoding='utf-8-sig')
          print('Documentation checks passed')
          PY
      - name: Compile Python demo scripts
        run: python -m compileall -q code/py_files
      - name: Parse Jupyter notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          files=list(Path('code/nb_files').glob('*.ipynb'))
          for f in files: json.loads(f.read_text(encoding='utf-8'))
          print('Validated',len(files),'notebooks')
          PY
